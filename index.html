<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Budget Manager</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f2f2f7; margin: 0; padding: 16px; color: #1c1c1e; padding-bottom: 80px; }
        .container { max-width: 600px; margin: 0 auto; }
        h2 { text-align: center; font-size: 24px; margin-bottom: 20px; }
        
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .card { background: #ffffff; padding: 16px; border-radius: 14px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .card.balance { grid-column: span 2; background: #007aff; color: white; }
        .card.plan-balance { grid-column: span 2; background: #5856d6; color: white; }
        .card h3 { margin: 0 0 5px 0; font-size: 14px; font-weight: 500; opacity: 0.9; }
        .card p { margin: 0; font-size: 24px; font-weight: bold; }
        .text-green { color: #34c759; }
        .text-red { color: #ff3b30; }

        .form-section { background: #ffffff; padding: 16px; border-radius: 14px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #e5e5ea; border-radius: 10px; font-size: 16px; box-sizing: border-box; background-color: #ffffff; }
        .btn-primary { background: #007aff; color: white; border: none; font-weight: bold; padding: 14px; cursor: pointer; }
        .btn-plan { background: #5856d6; color: white; border: none; font-weight: bold; padding: 14px; cursor: pointer; }
        button:active { opacity: 0.8; }
        optgroup { font-weight: bold; color: #8e8e93; }

        .list { list-style: none; padding: 0; margin: 0; }
        .item { background: #ffffff; padding: 16px; border-radius: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .item-info h4 { margin: 0 0 4px 0; font-size: 16px; }
        .item-info p { margin: 0; font-size: 12px; color: #8e8e93; }
        .btn-delete { background: #ff3b30; color: white; width: auto; padding: 6px 12px; font-size: 12px; margin: 0 0 0 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer;}

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-top: 1px solid #e5e5ea; display: flex; justify-content: space-around; padding: 10px 0 max(10px, env(safe-area-inset-bottom)) 0; z-index: 1000; }
        .nav-item { background: none; border: none; color: #8e8e93; font-size: 14px; font-weight: 500; display: flex; flex-direction: column; align-items: center; width: 100%; padding: 8px 0; cursor: pointer; }
        .nav-item.active { color: #007aff; }
        .nav-item span { font-size: 20px; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="view-dashboard" class="view active">
        <h2>Dashboard</h2>
        <div class="dashboard">
            <div class="card balance">
                <h3>Current Balance</h3>
                <p id="total-balance">$ 0.00</p>
            </div>
            <div class="card">
                <h3>Income</h3>
                <p id="total-income" class="text-green">$ 0.00</p>
            </div>
            <div class="card">
                <h3>Expenses</h3>
                <p id="total-expense" class="text-red">$ 0.00</p>
            </div>
        </div>

        <div class="form-section">
            <form id="transaction-form">
                <input type="date" id="date" required>
                <input type="text" id="description" placeholder="Description (e.g., Groceries)" required>
                <input type="number" id="amount" placeholder="Amount ($)" step="0.01" required>
                <select id="type">
                    <option value="expense" selected>Expense (-)</option>
                    <option value="income">Income (+)</option>
                </select>
                <select id="category" class="category-select"></select>
                <button type="submit" class="btn-primary">Add Transaction</button>
            </form>
        </div>

        <h3>Recent Activity</h3>
        <ul id="transaction-list" class="list"></ul>
    </div>

    <div id="view-planning" class="view">
        <h2>Monthly Plan</h2>
        <div class="dashboard">
            <div class="card plan-balance">
                <h3>Expected Balance</h3>
                <p id="plan-total-balance">$ 0.00</p>
            </div>
            <div class="card">
                <h3>Expected Income</h3>
                <p id="plan-total-income" class="text-green">$ 0.00</p>
            </div>
            <div class="card">
                <h3>Expected Expenses</h3>
                <p id="plan-total-expense" class="text-red">$ 0.00</p>
            </div>
        </div>

        <div class="form-section">
            <form id="plan-form">
                <input type="date" id="plan-date" required>
                <input type="text" id="plan-description" placeholder="Planned Item (e.g., Rent)" required>
                <input type="number" id="plan-amount" placeholder="Expected Amount ($)" step="0.01" required>
                <select id="plan-type">
                    <option value="expense" selected>Expense (-)</option>
                    <option value="income">Income (+)</option>
                </select>
                <select id="plan-category" class="category-select"></select>
                <button type="submit" class="btn-plan">Add to Plan</button>
            </form>
        </div>

        <h3>Budget Items</h3>
        <ul id="plan-list" class="list"></ul>
    </div>

</div>

<nav class="bottom-nav">
    <button class="nav-item active" onclick="window.switchTab('dashboard', this)">
        <span>📊</span> Dashboard
    </button>
    <button class="nav-item" onclick="window.switchTab('planning', this)">
        <span>📋</span> Planning
    </button>
</nav>

<script>
    window.switchTab = function(tabId, btnElement) {
        document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
        document.getElementById('view-' + tabId).classList.add('active');
        btnElement.classList.add('active');
        window.scrollTo(0, 0);
    };

    window.deleteTransaction = function(index) {
        transactions.splice(index, 1);
        updateDashboard();
    };

    window.deletePlanItem = function(index) {
        planItems.splice(index, 1);
        updatePlanning();
    };

    function safeLoad(key) {
        try {
            const data = localStorage.getItem(key);
            return data ? JSON.parse(data) : [];
        } catch (error) {
            console.warn("Resetando armazenamento corrompido.");
            return [];
        }
    }

    let transactions = safeLoad('budget_data');
    let planItems = safeLoad('budget_plan_data');

    const categoriesHTML = `
        <optgroup label="Income">
            <option value="Salary / Wages">Salary / Wages</option>
            <option value="Side Hustle / Freelance">Side Hustle / Freelance</option>
            <option value="Returns / Dividends">Returns / Dividends</option>
            <option value="Other Income">Other Income</option>
        </optgroup>
        <optgroup label="Housing & Utilities">
            <option value="Rent / Mortgage">Rent / Mortgage</option>
            <option value="Utilities (Water, Gas, Power)">Utilities (Water, Gas, Power)</option>
            <option value="Internet & Phone">Internet & Phone</option>
            <option value="Home Maintenance">Home Maintenance</option>
        </optgroup>
        <optgroup label="Food & Dining">
            <option value="Groceries">Groceries</option>
            <option value="Dining Out & Delivery">Dining Out & Delivery</option>
        </optgroup>
        <optgroup label="Transportation">
            <option value="Gas & Public Transit">Gas & Public Transit</option>
            <option value="Auto Maintenance">Auto Maintenance</option>
            <option value="Car Payment">Car Payment</option>
        </optgroup>
        <optgroup label="Health & Wellness">
            <option value="Medical & Pharmacy">Medical & Pharmacy</option>
            <option value="Gym & Fitness">Gym & Fitness</option>
            <option value="Personal Care">Personal Care</option>
        </optgroup>
        <optgroup label="Lifestyle & Entertainment">
            <option value="Subscriptions">Subscriptions (Software, Streaming)</option>
            <option value="Hobbies & Recreation">Hobbies & Recreation</option>
            <option value="Shopping & Clothing">Shopping & Clothing</option>
            <option value="Travel">Travel</option>
        </optgroup>
        <optgroup label="Financial Obligations">
            <option value="Debt & Loans">Debt & Loans</option>
            <option value="Insurance (Life, Home, Auto)">Insurance (Life, Home, Auto)</option>
            <option value="Taxes">Taxes</option>
        </optgroup>
        <optgroup label="Savings & Education">
            <option value="Emergency Fund">Emergency Fund</option>
            <option value="Investments">Investments</option>
            <option value="Courses & Education">Courses & Education</option>
        </optgroup>
