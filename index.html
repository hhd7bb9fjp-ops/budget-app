<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Budget Manager v2</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f2f2f7; margin: 0; padding: 16px; color: #1c1c1e; padding-bottom: 90px; }
        .container { max-width: 600px; margin: 0 auto; }
        h2 { text-align: center; font-size: 22px; margin-bottom: 16px; }
        
        .view { display: none; }
        .view.active { display: block; }
        
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .card { background: #ffffff; padding: 16px; border-radius: 14px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .card.balance { grid-column: span 2; background: #007aff; color: white; }
        .card.plan-balance { grid-column: span 2; background: #5856d6; color: white; }
        .card h3 { margin: 0 0 5px 0; font-size: 14px; font-weight: 500; opacity: 0.9; }
        .card p { margin: 0; font-size: 24px; font-weight: bold; }
        .text-green { color: #34c759; }
        .text-red { color: #ff3b30; }

        .form-section { background: #ffffff; padding: 16px; border-radius: 14px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #e5e5ea; border-radius: 10px; font-size: 16px; box-sizing: border-box; background-color: #ffffff; }
        .btn-primary { background: #007aff; color: white; border: none; font-weight: bold; padding: 14px; cursor: pointer; }
        .btn-plan { background: #5856d6; color: white; border: none; font-weight: bold; padding: 14px; cursor: pointer; }
        optgroup { font-weight: bold; color: #8e8e93; }

        .list { list-style: none; padding: 0; margin: 0; }
        .item { background: #ffffff; padding: 16px; border-radius: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .item-info h4 { margin: 0 0 4px 0; font-size: 16px; }
        .item-info p { margin: 0; font-size: 12px; color: #8e8e93; }
        .btn-delete { background: #ff3b30; color: white; width: auto; padding: 6px 12px; font-size: 12px; margin: 0 0 0 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; border-top: 1px solid #e5e5ea; display: flex; justify-content: space-around; padding: 10px 0 20px 0; z-index: 1000; }
        .nav-item { background: none; border: none; color: #8e8e93; font-size: 14px; font-weight: 600; display: flex; flex-direction: column; align-items: center; width: 50%; padding: 8px 0; cursor: pointer; margin: 0; }
        .nav-item.active { color: #007aff; }
        .nav-item span { font-size: 20px; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- TELA 1: DASHBOARD -->
    <div id="view-dashboard" class="view active">
        <h2>Dashboard v2.0</h2>
        <div class="dashboard">
            <div class="card balance">
                <h3>Current Balance</h3>
                <p id="total-balance">$ 0.00</p>
            </div>
            <div class="card">
                <h3>Income</h3>
                <p id="total-income" class="text-green">$ 0.00</p>
            </div>
            <div class="card">
                <h3>Expenses</h3>
                <p id="total-expense" class="text-red">$ 0.00</p>
            </div>
        </div>

        <div class="form-section">
            <form id="transaction-form">
                <input type="date" id="date" required>
                <input type="text" id="description" placeholder="Description (e.g., Groceries)" required>
                <input type="number" id="amount" placeholder="Amount ($)" step="0.01" required>
                <select id="type">
                    <option value="expense" selected>Expense (-)</option>
                    <option value="income">Income (+)</option>
                </select>
                <select id="category">
                    <optgroup label="Income">
                        <option value="Salary / Wages">Salary / Wages</option>
                        <option value="Side Hustle / Freelance">Side Hustle / Freelance</option>
                        <option value="Other Income">Other Income</option>
                    </optgroup>
                    <optgroup label="Housing & Utilities">
                        <option value="Rent / Mortgage">Rent / Mortgage</option>
                        <option value="Utilities">Utilities (Water, Gas, Power)</option>
                        <option value="Internet & Phone">Internet & Phone</option>
                    </optgroup>
                    <optgroup label="Food & Dining">
                        <option value="Groceries">Groceries</option>
                        <option value="Dining Out">Dining Out & Delivery</option>
                    </optgroup>
                    <optgroup label="Transportation">
                        <option value="Gas & Transit">Gas & Public Transit</option>
                        <option value="Car & Maintenance">Car Payment & Maintenance</option>
                    </optgroup>
                    <optgroup label="Health & Lifestyle">
                        <option value="Medical & Pharmacy">Medical & Pharmacy</option>
                        <option value="Gym & Fitness">Gym & Fitness</option>
                        <option value="Subscriptions">Subscriptions & Streaming</option>
                        <option value="Shopping & Entertainment">Shopping & Entertainment</option>
                    </optgroup>
                    <optgroup label="Savings & Obligations">
                        <option value="Debt & Loans">Debt & Loans</option>
                        <option value="Emergency Fund & Investments">Savings & Investments</option>
                        <option value="Education">Courses & Education</option>
                    </optgroup>
                </select>
                <button type="submit" class="btn-primary">Add Transaction</button>
            </form>
        </div>

        <h3>Recent Activity</h3>
        <ul id="transaction-list" class="list"></ul>
    </div>

    <!-- TELA 2: PLANNING -->
    <div id="view-planning" class="view">
        <h2>Monthly Plan v2.0</h2>
        <div class="dashboard">
            <div class="card plan-balance">
                <h3>Expected Balance</h3>
                <p id="plan-total-balance">$ 0.00</p>
            </div>
            <div class="card">
                <h3>Expected Income</h3>
                <p id="plan-total-income" class="text-green">$ 0.00</p>
            </div>
            <div class="card">
                <h3>Expected Expenses</h3>
                <p id="plan-total-expense" class="text-red">$ 0.00</p>
            </div>
        </div>

        <div class="form-section">
            <form id="plan-form">
                <input type="date" id="plan-date" required>
                <input type="text" id="plan-description" placeholder="Planned Item (e.g., Rent)" required>
                <input type="number" id="plan-amount" placeholder="Expected Amount ($)" step="0.01" required>
                <select id="plan-type">
                    <option value="expense" selected>Expense (-)</option>
                    <option value="income">Income (+)</option>
                </select>
                <select id="plan-category">
                    <optgroup label="Income">
                        <option value="Salary / Wages">Salary / Wages</option>
                        <option value="Side Hustle / Freelance">Side Hustle / Freelance</option>
                        <option value="Other Income">Other Income</option>
                    </optgroup>
                    <optgroup label="Housing & Utilities">
                        <option value="Rent / Mortgage">Rent / Mortgage</option>
                        <option value="Utilities">Utilities (Water, Gas, Power)</option>
                        <option value="Internet & Phone">Internet & Phone</option>
                    </optgroup>
                    <optgroup label="Food & Dining">
                        <option value="Groceries">Groceries</option>
                        <option value="Dining Out">Dining Out & Delivery</option>
                    </optgroup>
                    <optgroup label="Transportation">
                        <option value="Gas & Transit">Gas & Public Transit</option>
                        <option value="Car & Maintenance">Car Payment & Maintenance</option>
                    </optgroup>
                    <optgroup label="Health & Lifestyle">
                        <option value="Medical & Pharmacy">Medical & Pharmacy</option>
                        <option value="Gym & Fitness">Gym & Fitness</option>
                        <option value="Subscriptions">Subscriptions & Streaming</option>
                        <option value="Shopping & Entertainment">Shopping & Entertainment</option>
                    </optgroup>
                    <optgroup label="Savings & Obligations">
                        <option value="Debt & Loans">Debt & Loans</option>
                        <option value="Emergency Fund & Investments">Savings & Investments</option>
                        <option value="Education">Courses & Education</option>
                    </optgroup>
                </select>
                <button type="submit" class="btn-plan">Add to Plan</button>
            </form>
        </div>

        <h3>Budget Items</h3>
        <ul id="plan-list" class="list"></ul>
    </div>

</div>

<!-- BARRA DE NAVEGAÇÃO -->
<nav class="bottom-nav">
    <button type="button" class="nav-item active" id="btn-nav-dash">
        <span>📊</span> Dashboard
    </button>
    <button type="button" class="nav-item" id="btn-nav-plan">
        <span>📋</span> Planning
    </button>
</nav>

<script>
    // 1. NAVEGAÇÃO DIRETA E SIMPLES
    const viewDash = document.getElementById('view-dashboard');
    const viewPlan = document.getElementById('view-planning');
    const btnDash = document.getElementById('btn-nav-dash');
    const btnPlan = document.getElementById('btn-nav-plan');

    btnDash.addEventListener('click', function() {
        viewPlan.classList.remove('active');
        btnPlan.classList.remove('active');
        viewDash.classList.add('active');
        btnDash.classList.add('active');
        window.scrollTo(0, 0);
    });

    btnPlan.addEventListener('click', function() {
        viewDash.classList.remove('active');
        btnDash.classList.remove('active');
        viewPlan.classList.add('active');
        btnPlan.classList.add('active');
        window.scrollTo(0, 0);
    });

    // 2. DATAS PADRÃO
    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('date').value = todayStr;
    document.getElementById('plan-date').value = todayStr;

    // 3. BANCO DE DADOS LOCAL (NOVAS CHAVES PARA EVITAR DADOS CORROMPIDOS ANTIGOS)
    let transactions = JSON.parse(localStorage.getItem('app_transactions_v2')) || [];
    let planItems = JSON.parse(localStorage.getItem('app_plan_v2')) || [];

    // 4. ATUALIZAR DASHBOARD
    function renderDashboard() {
        const list = document.getElementById('transaction-list');
        list.innerHTML = '';
        let inc = 0, exp = 0;

        for (let i = 0; i < transactions.length; i++) {
            const t = transactions[i];
            const val = parseFloat(t.amount) || 0;
            if (t.type === 'income') inc += val; else exp += val;

            const li = document.createElement('li');
            li.className = 'item';
            li.innerHTML = '<div class="item-info"><h4>' + t.description + '</h4><p>' + t.category + ' • ' + t.date + '</p></div>' +
                           '<div style="display:flex;align-items:center;"><span class="' + (t.type === 'income' ? 'text-green' : 'text-red') + '">' +
                           (t.type === 'income' ? '+' : '-') + '$ ' + val.toFixed(2) + '</span>' +
                           '<button class="btn-delete" onclick="removeTx(' + i + ')">X</button></div>';
            list.appendChild(li);
        }

        document.getElementById('total-income').innerText = '$ ' + inc.toFixed(2);
        document.getElementById('total-expense').innerText = '$ ' + exp.toFixed(2);
        document.getElementById('total-balance').innerText = '$ ' + (inc - exp).toFixed(2);
        localStorage.setItem('app_transactions_v2', JSON.stringify(transactions));
    }

    window.removeTx = function(index) {
        transactions.splice(index, 1);
        renderDashboard();
    };

    document.getElementById('transaction-form').addEventListener('submit', function(e) {
        e.preventDefault();
        transactions.push({
            date: document.getElementById('date').value,
            description: document.getElementById('description').value,
            amount: parseFloat(document.getElementById('amount').value) || 0,
            type: document.getElementById('type').value,
            category: document.getElementById('category').value
        });
        this.reset();
        document.getElementById('date').value = todayStr;
        renderDashboard();
    });

    // 5. ATUALIZAR PLANEJAMENTO
    function renderPlanning() {
        const list = document.getElementById('plan-list');
        list.innerHTML = '';
        let inc = 0, exp = 0;

        for (let i = 0; i < planItems.length; i++) {
            const p = planItems[i];
            const val = parseFloat(p.amount) || 0;
            if (p.type === 'income') inc += val; else exp += val;

            const li = document.createElement('li');
            li.className = 'item';
            li.innerHTML = '<div class="item-info"><h4>' + p.description + '</h4><p>' + p.category + ' • ' + p.date + '</p></div>' +
                           '<div style="display:flex;align-items:center;"><span class="' + (p.type === 'income' ? 'text-green' : 'text-red') + '">' +
                           (p.type === 'income' ? '+' : '-') + '$ ' + val.toFixed(2) + '</span>' +
                           '<button class="btn-delete" onclick="removePlan(' + i + ')">X</button></div>';
            list.appendChild(li);
        }

        document.getElementById('plan-total-income').innerText = '$ ' + inc.toFixed(2);
        document.getElementById('plan-total-expense').innerText = '$ ' + exp.toFixed(2);
        document.getElementById('plan-total-balance').innerText = '$ ' + (inc - exp).toFixed(2);
        localStorage.setItem('app_plan_v2', JSON.stringify(planItems));
    }

    window.removePlan = function(index) {
        planItems.splice(index, 1);
        renderPlanning();
    };

    document.getElementById('plan-form').addEventListener('submit', function(e) {
        e.preventDefault();
        planItems.push({
            date: document.getElementById('plan-date').value,
            description: document.getElementById('plan-description').value,
            amount: parseFloat(document.getElementById('plan-amount').value) || 0,
            type: document.getElementById('plan-type').value,
            category: document.getElementById('plan-category').value
        });
        this.reset();
        document.getElementById('plan-date').value = todayStr;
        renderPlanning();
    });

    // INICIAR
    renderDashboard();
    renderPlanning();
</script>
</body>
</html>
